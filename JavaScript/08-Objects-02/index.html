<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Order Management</title>

    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Order Management System</h1>

        <p>Manage customer orders.</p>
      </header>

      <section class="form">
        <div class="input-box">
          <label>Customer Name</label>
          <input type="text" id="customerName" />
        </div>

        <div class="input-box">
          <label>Product Name</label>
          <input type="text" id="productName" />
        </div>

        <div class="input-box">
          <label>Product Price</label>
          <input type="number" id="price" />
        </div>

        <div class="input-box">
          <label>Quantity</label>
          <input type="number" id="quantity" />
        </div>

        <div class="buttons">
          <button id="createBtn">Create Order</button>

          <button id="discountBtn">Apply 10% Discount</button>

          <button id="shipBtn">Ship Order</button>

          <button id="cancelBtn">Cancel Order</button>

          <button id="showBtn">Show Order</button>

          <button id="clearBtn">Clear</button>
        </div>
      </section>

      <section class="summary">
        <h2>Order Summary</h2>

        <div class="row">
          <span>Customer</span>
          <strong id="showCustomer">----</strong>
        </div>

        <div class="row">
          <span>Product</span>
          <strong id="showProduct">----</strong>
        </div>

        <div class="row">
          <span>Quantity</span>
          <strong id="showQuantity">----</strong>
        </div>

        <div class="row">
          <span>Total Price</span>
          <strong id="showPrice">----</strong>
        </div>

        <div class="row">
          <span>Order Status</span>
          <strong id="showStatus">----</strong>
        </div>
      </section>
    </div>
  </body>
</html>

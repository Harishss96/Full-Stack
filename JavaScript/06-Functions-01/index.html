<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Smart Banking Dashboard</title>

    <link rel="stylesheet" href="style.css" />

    <script defer src="script.js"></script>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Smart Banking Dashboard</h1>

        <p>Manage your account using reusable JavaScript functions.</p>
      </header>

      <section class="form">
        <div class="input-box">
          <label>Account Holder</label>
          <input type="text" id="accountHolder" />
        </div>

        <div class="input-box">
          <label>Account Number</label>
          <input type="text" id="accountNumber" />
        </div>

        <div class="input-box">
          <label>Current Balance</label>
          <input type="number" id="balance" />
        </div>

        <div class="input-box">
          <label>Deposit Amount</label>
          <input type="number" id="deposit" />
        </div>

        <div class="input-box">
          <label>Withdraw Amount</label>
          <input type="number" id="withdraw" />
        </div>

        <div class="buttons">
          <button id="showBtn">Show Account</button>

          <button id="depositBtn">Deposit</button>

          <button id="withdrawBtn">Withdraw</button>
        </div>
      </section>

      <section class="account-card">
        <h2>Account Summary</h2>

        <div class="row">
          <span>Account Holder</span>
          <strong id="showName">----</strong>
        </div>

        <div class="row">
          <span>Account Number</span>
          <strong id="showAccount">----</strong>
        </div>

        <div class="row">
          <span>Current Balance</span>
          <strong id="showBalance">----</strong>
        </div>

        <div class="row">
          <span>Last Transaction</span>
          <strong id="transaction">----</strong>
        </div>
      </section>
    </div>
  </body>
</html>

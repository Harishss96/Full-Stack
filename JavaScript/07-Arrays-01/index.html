<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shopping Cart</title>

    <link rel="stylesheet" href="style.css" />

    <script defer src="script.js"></script>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Shopping Cart Manager</h1>

        <p>Add products to your shopping cart.</p>
      </header>

      <section class="form">
        <div class="input-box">
          <label>Product Name</label>
          <input type="text" id="productName" />
        </div>

        <div class="input-box">
          <label>Price</label>
          <input type="number" id="price" />
        </div>

        <div class="buttons">
          <button id="addBtn">Add Product</button>

          <button id="showBtn">Show Cart</button>

          <button id="clearBtn">Clear Cart</button>
        </div>
      </section>

      <section class="cart">
        <h2>Shopping Cart</h2>

        <div id="cartItems">
          <p>No Products Added</p>
        </div>
      </section>
    </div>
  </body>
</html>

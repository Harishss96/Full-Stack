<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Ticket Booking</title>

    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Movie Ticket Booking</h1>

        <p>Book and manage your movie tickets.</p>
      </header>

      <section class="form">
        <div class="input-box">
          <label>Customer Name</label>
          <input type="text" id="customerName" />
        </div>

        <div class="input-box">
          <label>Movie Name</label>
          <input type="text" id="movieName" />
        </div>

        <div class="input-box">
          <label>Ticket Price</label>
          <input type="number" id="ticketPrice" />
        </div>

        <div class="input-box">
          <label>Number of Tickets</label>
          <input type="number" id="ticketCount" />
        </div>

        <div class="buttons">
          <button id="bookBtn">Book Tickets</button>

          <button id="cancelBtn">Cancel Booking</button>

          <button id="summaryBtn">Booking Summary</button>
        </div>
      </section>

      <section class="summary">
        <h2>Booking Summary</h2>

        <div class="row">
          <span>Customer</span>
          <strong id="showCustomer">----</strong>
        </div>

        <div class="row">
          <span>Movie</span>
          <strong id="showMovie">----</strong>
        </div>

        <div class="row">
          <span>Total Tickets</span>
          <strong id="showTickets">----</strong>
        </div>

        <div class="row">
          <span>Total Amount</span>
          <strong id="showAmount">----</strong>
        </div>

        <div class="row">
          <span>Booking Status</span>
          <strong id="showStatus">----</strong>
        </div>
      </section>
    </div>
  </body>
</html>

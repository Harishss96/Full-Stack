<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subscription Cost Calculator</title>

    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <h1>Subscription Calculator</h1>
        <p class="subtitle">
          Calculate your subscription amount after discount and GST.
        </p>

        <div class="row">
          <span>Monthly Price</span>
          <strong id="price">----</strong>
        </div>

        <div class="row">
          <span>Duration (Months)</span>
          <strong id="months">----</strong>
        </div>

        <div class="row">
          <span>Discount</span>
          <strong id="discount">----</strong>
        </div>

        <div class="row">
          <span>GST</span>
          <strong id="gst">----</strong>
        </div>

        <hr />

        <div class="row">
          <span>Subtotal</span>
          <strong id="subtotal">----</strong>
        </div>

        <div class="row">
          <span>Discount Amount</span>
          <strong id="discountAmount">----</strong>
        </div>

        <div class="row">
          <span>GST Amount</span>
          <strong id="gstAmount">----</strong>
        </div>

        <hr />

        <div class="row total">
          <span>Final Amount</span>
          <strong id="total">----</strong>
        </div>
      </div>
    </div>
  </body>
</html>

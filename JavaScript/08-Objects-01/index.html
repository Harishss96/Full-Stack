<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Employee Profile Manager</title>

    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Employee Profile Manager</h1>

        <p>Create and manage employee profiles.</p>
      </header>

      <section class="form">
        <div class="input-box">
          <label>Employee Name</label>
          <input type="text" id="name" />
        </div>

        <div class="input-box">
          <label>Employee ID</label>
          <input type="text" id="employeeId" />
        </div>

        <div class="input-box">
          <label>Department</label>
          <input type="text" id="department" />
        </div>

        <div class="input-box">
          <label>Designation</label>
          <input type="text" id="designation" />
        </div>

        <div class="input-box">
          <label>Salary</label>
          <input type="number" id="salary" />
        </div>

        <div class="input-box">
          <label>Email</label>
          <input type="email" id="email" />
        </div>

        <div class="buttons">
          <button id="createBtn">Create Profile</button>

          <button id="showBtn">Show Profile</button>

          <button id="clearBtn">Clear</button>
        </div>
      </section>

      <section class="profile">
        <h2>Employee Profile</h2>

        <div class="row">
          <span>Name</span>
          <strong id="showName">----</strong>
        </div>

        <div class="row">
          <span>Employee ID</span>
          <strong id="showEmployeeId">----</strong>
        </div>

        <div class="row">
          <span>Department</span>
          <strong id="showDepartment">----</strong>
        </div>

        <div class="row">
          <span>Designation</span>
          <strong id="showDesignation">----</strong>
        </div>

        <div class="row">
          <span>Salary</span>
          <strong id="showSalary">----</strong>
        </div>

        <div class="row">
          <span>Email</span>
          <strong id="showEmail">----</strong>
        </div>
      </section>
    </div>
  </body>
</html>
